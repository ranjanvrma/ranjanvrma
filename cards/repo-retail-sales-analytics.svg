<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="840" height="238" viewBox="0 0 840 238" role="img" aria-label="Retail Sales Analytics: From messy data to business insights. What drives sales and profit across products, customers and regions. SQL with CTEs, joins and window functions, with an interactive Power BI dashboard on top."><title>Retail Sales Analytics: From messy data to business insights. What drives sales and profit across products, customers and regions. SQL with CTEs, joins and window functions, with an interactive Power BI dashboard on top.</title><style>@font-face{font-family:JBM;font-weight:400;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:JBM;font-weight:700;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:JBM;font-weight:800;src:url(data:font/woff;base64,) format('woff')}
svg{--bg:#F3F8FB;--line:#D3E2EB;--ink:#0B2131;--mut:#4A6475;--acc:#0369A1;--bar:#0EA5E9}
@media (prefers-color-scheme:dark){svg{--bg:#0F1D28;--line:#223747;--ink:#E4EEF4;--mut:#8FA8B8;--acc:#7DD3FC;--bar:#38BDF8}}
text{font-family:JBM, 'JetBrains Mono', ui-monospace, monospace}
.card{fill:var(--bg);stroke:var(--line)}
.ink{fill:var(--ink)}.mut{fill:var(--mut)}.acc{fill:var(--acc)}
.bar{fill:var(--bar)}.rule{stroke:var(--line);fill:none}.pill{fill:none;stroke:var(--line)}
.btn{fill:var(--bar)}.btnt{fill:#0B2131}.brand{fill:#38BDF8}.g0{fill:var(--line)}
.g1{fill:#38BDF8;fill-opacity:.32}.g2{fill:#38BDF8;fill-opacity:.55}
.g3{fill:#38BDF8;fill-opacity:.78}.g4{fill:#38BDF8}

.rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.fade{animation:fade .5s ease-out both}
.pop{animation:fade .3s ease-out both}
.blink{animation:blink 1.06s steps(1,end) 4 both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@keyframes fade{from{opacity:0}}
@keyframes blink{50%{opacity:0}}
.s{display:none}
@media (prefers-reduced-motion:reduce){
*{animation:none!important}
.m{display:none}.s{display:inline}
}
