<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="840" height="304" viewBox="0 0 840 304" role="img" aria-label="Rig Sight: Agentic AI for drilling operations. A LangGraph multi-agent system that reads Daily Drilling Reports and tracks non-productive time across six categories. Planner, Research, Executor and Critic agents share state and check each other&#x27;s work; all maths stays in deterministic Python."><title>Rig Sight: Agentic AI for drilling operations. A LangGraph multi-agent system that reads Daily Drilling Reports and tracks non-productive time across six categories. Planner, Research, Executor and Critic agents share state and check each other&#x27;s work; all maths stays in deterministic Python.</title><style>@font-face{font-family:JBM;font-weight:400;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:JBM;font-weight:700;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:JBM;font-weight:800;src:url(data:font/woff;base64,) format('woff')}
svg{--bg:#F3F8FB;--line:#D3E2EB;--ink:#0B2131;--mut:#4A6475;--acc:#0369A1;--bar:#0EA5E9}
@media (prefers-color-scheme:dark){svg{--bg:#0F1D28;--line:#223747;--ink:#E4EEF4;--mut:#8FA8B8;--acc:#7DD3FC;--bar:#38BDF8}}
text{font-family:JBM, 'JetBrains Mono', ui-monospace, monospace}
.card{fill:var(--bg);stroke:var(--line)}
.ink{fill:var(--ink)}.mut{fill:var(--mut)}.acc{fill:var(--acc)}
.bar{fill:var(--bar)}.rule{stroke:var(--line);fill:none}.pill{fill:none;stroke:var(--line)}
.brand{fill:#38BDF8}.g0{fill:var(--line)}
.g1{fill:#38BDF8;fill-opacity:.32}.g2{fill:#38BDF8;fill-opacity:.55}
.g3{fill:#38BDF8;fill-opacity:.78}.g4{fill:#38BDF8}

.rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.fade{animation:fade .5s ease-out both}
.pop{animation:fade .3s ease-out both}
.blink{animation:blink 1.06s steps(1,end) 4 both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@keyframes fade{from{opacity:0}}
@keyframes blink{50%{opacity:0}}
.s{display:none}
@media (prefers-reduced-motion:reduce){
*{animation:none!important}
.m{display:none}.s{display:inline}
}
</style><rect class="card" x=".5" y=".5" width="839" height="303" rx="14"/><g class="rise" style="animation-delay:3.00s"><text x="40" y="62" font-size="24" font-weight="800" class="ink">Rig Sight</text><text x="40" y="90" font-size="15" font-weight="700" class="acc">Agentic AI for drilling operations</text><text x="40" y="124" font-size="14" font-weight="400" class="mut">A LangGraph multi-agent system that reads Daily Drilling</text><text x="40" y="146" font-size="14" font-weight="400" class="mut">Reports and tracks non-productive time across six categories.</text><text x="40" y="168" font-size="14" font-weight="400" class="mut">Planner, Research, Executor and Critic agents share state and</text><text x="40" y="190" font-size="14" font-weight="400" class="mut">check each other&#x27;s work; all maths stays in deterministic</text><text x="40" y="212" font-size="14" font-weight="400" class="mut">Python.</text><rect class="pill" x="40.5" y="246.5" width="86.8" height="24" rx="12"/><text x="83.4" y="262.5" font-size="12" font-weight="400" class="ink" text-anchor="middle">LangGraph</text><rect class="pill" x="135.3" y="246.5" width="86.8" height="24" rx="12"/><text x="178.2" y="262.5" font-size="12" font-weight="400" class="ink" text-anchor="middle">LangChain</text><rect class="pill" x="230.1" y="246.5" width="72.4" height="24" rx="12"/><text x="265.8" y="262.5" font-size="12" font-weight="400" class="ink" text-anchor="middle">FastAPI</text><rect class="pill" x="310.5" y="246.5" width="50.8" height="24" rx="12"/><text x="335.4" y="262.5" font-size="12" font-weight="400" class="ink" text-anchor="middle">Groq</text><rect class="pill" x="369.3" y="246.5" width="65.2" height="24" rx="12"/><text x="401.4" y="262.5" font-size="12" font-weight="400" class="ink" text-anchor="middle">Pytest</text><line class="rule" x1="590" y1="42" x2="590" y2="262"/><text x="800" y="92" font-size="36" font-weight="800" class="acc" text-anchor="end">0.067 h</text><text x="800" y="120" font-size="12" font-weight="400" class="mut" text-anchor="end">NPT error on 15 synthetic</text><text x="800" y="138" font-size="12" font-weight="400" class="mut" text-anchor="end">reports, every planted</text><text x="800" y="156" font-size="12" font-weight="400" class="mut" text-anchor="end">mistake caught</text></g></svg>