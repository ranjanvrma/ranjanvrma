name: Profile cards

on:
  schedule:
    - cron: "23 0 * * *"   # daily, 05:53 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths: [render_cards.py, assets/**, fonts/**]

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh contribution data
        env:
          # The default token sees public contributions only. To count private ones,
          # add a classic PAT with the read:user scope as the CONTRIB_TOKEN secret.
          GH_TOKEN: ${{ secrets.CONTRIB_TOKEN || github.token }}
          LOGIN: ${{ github.repository_owner }}
        run: |
          mkdir -p data
          gh api graphql -F login="$LOGIN" -f query='
            query($login: String!) {
              user(login: $login) {
                contributionsCollection {
                  contributionCalendar {
                    weeks { contributionDays { date contributionCount contributionLevel } }
                  }
                }
              }
            }' > /tmp/calendar.json
          jq --arg login "$LOGIN" '{
            login: $login,
            days: [ .data.user.contributionsCollection.contributionCalendar.weeks[].contributionDays[]
                    | { date, count: .contributionCount,
                        level: ({NONE: 0, FIRST_QUARTILE: 1, SECOND_QUARTILE: 2,
                                 THIRD_QUARTILE: 3, FOURTH_QUARTILE: 4}[.contributionLevel]) } ]
          }' /tmp/calendar.json > data/contributions.json
          echo "$(jq '.days | length' data/contributions.json) days fetched"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render cards
        run: |
          pip install fonttools==4.55.0
          python render_cards.py

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json cards
          if git diff --cached --quiet; then
            echo "Cards unchanged"
          else
            git commit -m "Refresh profile cards"
            git push
          fi
